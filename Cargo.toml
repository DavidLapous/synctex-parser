[package]
name = "synctex-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pure-Rust SyncTeX parser and forward/inverse query engine with LaTeX/Beamer heuristics"
license = "MIT"

[dependencies]
flate2 = "1.1.9"
latex2mathml = "0.2.3"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.17"
unicode-normalization = "0.1.24"

[dev-dependencies]
tempfile = "3.27.0"
