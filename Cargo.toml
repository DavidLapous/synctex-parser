[package]
name = "synctex-parser"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Pure-Rust SyncTeX parser and forward/inverse query engine with LaTeX/Beamer heuristics"
license = "MIT"
repository = "https://github.com/DavidLapous/synctex-parser"
documentation = "https://docs.rs/synctex-parser"
readme = "README.md"
keywords = ["synctex", "latex", "tex", "beamer", "pdf"]
categories = ["parsing", "text-processing"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]

[dependencies]
flate2 = "1.1.9"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0.17"
unicode-normalization = "0.1.24"

[dev-dependencies]
tempfile = "3.27.0"
